<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Mirror</title>
<link rel="stylesheet" href="/page.css">
</head>
<body>
<div id="identify-overlay" class="overlay hidden">
	<div class="overlay-card">
		<h1>Meeting Mirror</h1>
		<p>Enter your name to join:</p>
		<input id="username-input" type="text" maxlength="40" autocomplete="off">
		<p id="identify-error" class="identify-error"></p>
		<button id="username-button">Join</button>
	</div>
</div>
<div id="top-right" class="top-right">
	<div id="identity-chip" class="identity-chip hidden"></div>
	<a id="board-link" class="board-link none" target="_blank" rel="noopener">Visual board (nothing shown)</a>
</div>
<main id="transcript" class="transcript"><div id="poll-card" class="poll-card" aria-live="polite"></div></main>
<div id="waiting" class="banner hidden">Waiting for the moderator…</div>
<div id="members" class="members hidden"></div>
<div id="board" class="board hidden">
	<p id="board-empty" class="board-empty">Nothing on the board yet</p>
	<iframe id="board-frame" class="board-frame hidden" sandbox="allow-scripts" title="Visual board"></iframe>
</div>
<button id="jump-latest" class="jump-latest hidden">↓ Jump to latest</button>
<script type="module" src="/page.js"></script>
</body>
</html>
